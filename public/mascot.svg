<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 32" width="120" height="160" fill="none">
  <!-- Body -->
  <rect x="3" y="1" width="18" height="24" rx="2.5" stroke="white" stroke-width="1.6"/>
  <!-- Freezer divider -->
  <line x1="4" y1="9" x2="20" y2="9" stroke="white" stroke-width="1.4"/>
  <!-- Top compartment handle -->
  <line x1="17" y1="4" x2="17" y2="6.5" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Bottom compartment handle -->
  <line x1="17" y1="13" x2="17" y2="16" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Cute eyes -->
  <circle cx="9" cy="13.5" r="0.9" fill="white"/>
  <circle cx="13" cy="13.5" r="0.9" fill="white"/>
  <!-- Tiny smile -->
  <path d="M 9.5 16.5 Q 11 17.5 12.5 16.5" stroke="white" stroke-width="1" stroke-linecap="round" fill="none"/>
  <!-- Left leg -->
  <line x1="8" y1="25" x2="8" y2="30" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="16" y1="25" x2="16" y2="30" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
